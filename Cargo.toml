[package]
name = "ymtui"
version = "1.0.0"
edition = "2024"
description = "Yandex Music terminal client inspired by spotatui"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
directories = "6"
libloading = "0.8"
md5 = "0.7"
rand = "0.9"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
souvlaki = { version = "0.8", default-features = false, features = ["use_zbus"] }
unicode-normalization = "0.1"
unicode-width = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_Foundation"] }

[profile.release]
lto = "thin"
strip = true

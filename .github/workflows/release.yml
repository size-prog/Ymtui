name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза для сборки и загрузки файлов'
        required: true
        default: 'v1.0.0'
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check
        shell: pwsh
        run: |
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tests/install-smoke.ps1
      - name: Download libmpv distribution
        shell: pwsh
        run: |
          $release = Invoke-RestMethod https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest
          $asset = @($release.assets | Where-Object name -Match '^mpv-dev-x86_64-[0-9].*\.7z$')
          if ($asset.Count -ne 1) { throw 'Expected one baseline x64 libmpv archive.' }
          Invoke-WebRequest $asset[0].browser_download_url -OutFile mpv.7z
          if ($asset[0].digest -match '^sha256:(.+)$') {
            if ((Get-FileHash mpv.7z -Algorithm SHA256).Hash -ine $Matches[1]) { throw 'libmpv checksum mismatch.' }
          }
          7z x mpv.7z -ompv-package
          if ($LASTEXITCODE -ne 0) { throw 'libmpv extraction failed.' }
          # The development archive contains the DLL but omits license files.
          # Include the GPL text from the mpv source tree in the distribution.
          $mpvDll = Get-ChildItem ./mpv-package -File -Filter '*mpv*.dll' | Select-Object -First 1
          if (-not $mpvDll) { throw 'libmpv DLL not found in archive.' }
          $mpvRef = 'master'
          if ($mpvDll.VersionInfo.FileVersion -match '-g([0-9a-f]{7,40})') { $mpvRef = $Matches[1] }
          Invoke-WebRequest "https://raw.githubusercontent.com/mpv-player/mpv/$mpvRef/LICENSE.GPL" -OutFile ./mpv-package/LICENSE.GPL
          ./package-windows.ps1 -SkipBuild -MpvDirectory ./mpv-package -MpvSourceUrl $release.html_url
      - name: Test packaged installation
        shell: pwsh
        run: ./tests/package-smoke.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ymtui-windows-x64
          path: dist/*
      - name: Upload release files
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v\d+\.\d+\.\d+([-.][A-Za-z0-9.-]+)?$') { throw 'Invalid release tag.' }
          $files = @('./dist/ymtui-windows-x64.zip', './dist/ymtui-windows-x64.zip.sha256', './dist/install-online.ps1')
          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --draft --verify-tag --title "ymtui $tag — первый релиз" --notes-file RELEASE_NOTES.md
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
    permissions:
      contents: write
